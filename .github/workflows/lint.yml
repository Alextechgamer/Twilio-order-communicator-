name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Hard gate: every PHP file must parse. Fast, no dependencies.
  # 7.4 is in the matrix because every plugin header declares `Requires PHP: 7.4`
  # — without it an 8.x-only construct would ship undetected to 7.4 sites.
  php-syntax:
    name: PHP syntax (php -l)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: |
          set -e
          find . \( -path ./vendor -o -path ./node_modules \) -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l
      - name: Unit tests (no dependencies)
        run: php tests/run.php
      - name: Version consistency (5 markers per plugin)
        run: php tools/release/check-versions.php
      - name: License client sync (generated copies match tools/license-client/)
        run: php tools/release/check-license-sync.php

  # Hard gate: end-to-end smoke of the flagship flow. Provisions a real
  # WordPress + WooCommerce site via tools/dev/setup-wp.sh, places an order,
  # moves it to Ready for Pickup, and asserts the outbound auto-SMS was
  # captured by the Twilio HTTP mock mu-plugin (/tmp/toc-http.log) with the
  # expected To number and template text. Goes red if class-toc-auto.php stops
  # sending on status change. No live Twilio credentials are used or needed.
  e2e-smoke:
    name: E2E smoke (order → Ready for Pickup → SMS via Twilio mock)
    # ubuntu-24.04 pinned (not -latest): setup-wp.sh apt-installs the php8.3-*
    # packages, which only exist in the 24.04 archive — this is what keeps the
    # job on PHP 8.3 even if the runner default moves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The runner image ships MySQL on port 3306; stop it so the MariaDB that
      # setup-wp.sh installs can bind. Harmless where the service is absent.
      - name: Stop preinstalled MySQL
        run: sudo systemctl stop mysql.service 2>/dev/null || true
      - name: Provision WordPress + WooCommerce + plugins (tools/dev/setup-wp.sh)
        run: bash tools/dev/setup-wp.sh
      - name: Assert PHP 8.3
        run: php -v && php -v | grep -qF 'PHP 8.3'
      - name: Run E2E smoke (order → status change → captured SMS)
        run: bash tools/dev/e2e-smoke.sh
      - name: Show WordPress debug.log on failure
        if: failure()
        run: cat "$HOME/wordpress/wp-content/debug.log" 2>/dev/null || echo "no debug.log"

  # Advisory: WordPress Coding Standards + PHPCompatibility. Not a hard gate yet
  # (see tasks.md G8) — the report is printed for humans but never fails the build,
  # so the historical docblock/Yoda/alignment debt does not block merges.
  phpcs:
    name: PHPCS (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      # Advisory tooling install: transient registry/SSL/network failures on the
      # runner must not turn this non-gating job red, so never let it exit non-zero.
      - name: Install tooling
        run: composer install --no-interaction --no-progress || true
      - name: Run PHPCS (advisory — style report, does not fail the build)
        run: |
          if [ -x vendor/bin/phpcs ]; then
            vendor/bin/phpcs --standard=phpcs.xml.dist -p --report=full || true
          else
            echo "PHPCS tooling unavailable (composer install did not complete) — skipping advisory style report."
          fi
