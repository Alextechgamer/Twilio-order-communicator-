name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Hard gate: every PHP file must parse. Fast, no dependencies.
  php-syntax:
    name: PHP syntax (php -l)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: |
          set -e
          find . \( -path ./vendor -o -path ./node_modules \) -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  # Advisory: WordPress Coding Standards + PHPCompatibility. Not a hard gate yet
  # (see tasks.md G8) — reports issues without failing the build.
  phpcs:
    name: PHPCS (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install tooling
        run: composer install --no-interaction --no-progress
      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist -p --report=full
